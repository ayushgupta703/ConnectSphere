# ========================= SERVER =========================
server.port=8080
spring.application.name=auth-service

# ========================= DATABASE =========================
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_auth
spring.datasource.username=root
spring.datasource.password=ayushgupta#cs22
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================= JPA =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================= ACTUATOR =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ========================= SWAGGER =========================
springdoc.swagger-ui.path=/swagger-ui.html

# ========================= JWT =========================
jwt.secret=Silent-rivers-flow-beneath-golden-skies-while-hidden-forests-whisper-secrets-through-the-night-wind
jwt.expiration-ms=86400000

# 🔥 NEW (REFRESH TOKEN)
jwt.refresh-expiration-ms=604800000

# ========================= OAUTH2 =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ========================= INTERNAL SERVICE =========================
# Shared secret for service-to-service calls (keep in sync with post-service)
internal.service.secret=cs-internal-secret-2024