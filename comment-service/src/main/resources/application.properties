# ===============================
# SERVER CONFIG
# ===============================
server.port=8083
spring.application.name=comment-service

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_comment?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ayushgupta#cs22

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SWAGGER CONFIG
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# FEIGN CLIENT LOGGING
# ===============================
logging.level.com.connectsphere.commentservice.client=DEBUG
feign.okhttp.enabled=true

# 🔹 JWT Secret (MUST match Auth Service)
jwt.secret=Silent-rivers-flow-beneath-golden-skies-while-hidden-forests-whisper-secrets-through-the-night-wind

# ===============================
# EUREKA CONFIG
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost