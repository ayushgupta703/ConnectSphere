spring.application.name=media-service
server.port=8087

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_media
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=Silent-rivers-flow-beneath-golden-skies-while-hidden-forests-whisper-secrets-through-the-night-wind

# Scheduler
spring.task.scheduling.pool.size=2