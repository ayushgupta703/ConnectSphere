spring.application.name=api-gateway
server.port=8088

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# API Gateway Routes (Reactive)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=post-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://POST-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/posts/**

spring.cloud.gateway.server.webflux.routes[2].id=comment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/comments/**

spring.cloud.gateway.server.webflux.routes[3].id=like-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://LIKE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/likes/**

spring.cloud.gateway.server.webflux.routes[4].id=follow-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://FOLLOW-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/follows/**

spring.cloud.gateway.server.webflux.routes[5].id=media-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/media/**

spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webflux.routes[7].id=search-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/search/**

spring.cloud.gateway.server.webflux.routes[8].id=story-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/v1/stories/**

spring.cloud.gateway.server.webflux.routes[9].id=hashtag-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/v1/hashtags/**

# Swagger Documentation Routes
spring.cloud.gateway.server.webflux.routes[10].id=auth-api-docs
spring.cloud.gateway.server.webflux.routes[10].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.server.webflux.routes[10].filters[0]=RewritePath=/v3/api-docs/auth, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[11].id=post-api-docs
spring.cloud.gateway.server.webflux.routes[11].uri=lb://POST-SERVICE
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/v3/api-docs/post
spring.cloud.gateway.server.webflux.routes[11].filters[0]=RewritePath=/v3/api-docs/post, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[12].id=comment-api-docs
spring.cloud.gateway.server.webflux.routes[12].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/v3/api-docs/comment
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/v3/api-docs/comment, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[13].id=like-api-docs
spring.cloud.gateway.server.webflux.routes[13].uri=lb://LIKE-SERVICE
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/v3/api-docs/like
spring.cloud.gateway.server.webflux.routes[13].filters[0]=RewritePath=/v3/api-docs/like, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[14].id=follow-api-docs
spring.cloud.gateway.server.webflux.routes[14].uri=lb://FOLLOW-SERVICE
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/v3/api-docs/follow
spring.cloud.gateway.server.webflux.routes[14].filters[0]=RewritePath=/v3/api-docs/follow, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[15].id=media-api-docs
spring.cloud.gateway.server.webflux.routes[15].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/v3/api-docs/media
spring.cloud.gateway.server.webflux.routes[15].filters[0]=RewritePath=/v3/api-docs/media, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[16].id=notification-api-docs
spring.cloud.gateway.server.webflux.routes[16].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/v3/api-docs/notification
spring.cloud.gateway.server.webflux.routes[16].filters[0]=RewritePath=/v3/api-docs/notification, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[17].id=search-api-docs
spring.cloud.gateway.server.webflux.routes[17].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.server.webflux.routes[17].predicates[0]=Path=/v3/api-docs/search
spring.cloud.gateway.server.webflux.routes[17].filters[0]=RewritePath=/v3/api-docs/search, /v3/api-docs

eureka.instance.hostname=localhost

# SpringDoc UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Grouped APIs for aggregation
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[1].name=Post Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/post
springdoc.swagger-ui.urls[2].name=Comment Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/comment
springdoc.swagger-ui.urls[3].name=Like Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/like
springdoc.swagger-ui.urls[4].name=Follow Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/follow
springdoc.swagger-ui.urls[5].name=Media Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/media
springdoc.swagger-ui.urls[6].name=Notification Service
springdoc.swagger-ui.urls[6].url=/v3/api-docs/notification
springdoc.swagger-ui.urls[7].name=Search Service
springdoc.swagger-ui.urls[7].url=/v3/api-docs/search
